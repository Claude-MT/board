  --accent:#2F6F62; --accent-deep:#1F4D43; --accent-soft:#E0EDE7; --on-accent:#FFFFFF;

}

  --sat:#6EA2E0; --sun:#E5776C; --dir:#5B8DEF; --vice:#F07AB4; --scrim:rgba(0,0,0,.6); color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font-family:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 8px;display:flex;flex-direction:column;gap:8px}
.r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:17px;font-weight:800;color:var(--accent-deep);letter-spacing:.02em}
.keisho{font-size:10.5px;font-weight:500;color:var(--ink-faint);margin-left:6px;letter-spacing:0}
.upd{font-size:11px;color:var(--ink-faint)}
.r2{display:flex;align-items:center;gap:6px}
.mbtn{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;cursor:pointer}
.mtitle{flex:1;text-align:center;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.today-btn{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent-deep);font-size:14px;font-weight:700;cursor:pointer}
.seg{display:flex;background:var(--muted);border-radius:10px;padding:2px}
.seg button{border:none;background:transparent;padding:6px 10px;font-size:13px;border-radius:8px;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.who{flex-shrink:0;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-soft)}
.who[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.who .dot{width:9px;height:9px;border-radius:9px}
main.wrap{padding-block:10px 28px;display:flex;flex-direction:column;gap:10px}
.staffbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.staffbar .seg button{font-size:13px;padding:0 10px}
.staffbar .today-btn{height:34px;display:inline-flex;align-items:center;text-decoration:none;flex:none}
.short-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.short-card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.short-card .tt{font-size:14px;font-weight:800}
.short-card .sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.short-card ul{list-style:none;margin:0;padding:0;font-size:14.5px;line-height:1.75}
.short-card li b{display:inline-block;min-width:6.6em;font-weight:700}
.short-card .ok{font-size:14px;color:var(--ink-soft)}
.mine-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mine-card .lbl{font-size:12px;color:var(--ink-faint)}
.mine-card .next{font-size:18px;font-weight:800}
.mine-card .sub{font-size:13px;color:var(--ink-soft)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:12.5px;color:var(--ink-soft);padding:0 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sd{width:8px;height:8px;border-radius:8px;display:inline-block;flex-shrink:0}
.sd.director{background:var(--dir)} .sd.vice{background:var(--vice)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;touch-action:pan-y}
.wd{text-align:center;font-size:12px;font-weight:700;color:var(--ink-soft);padding:2px 0 4px}
.wd.sun{color:var(--sun)} .wd.sat{color:var(--sat)}
.cell{min-width:0;min-height:92px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:3px 2px 4px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;font:inherit;cursor:pointer}

.cell.closed{background:var(--muted);border-color:transparent}

.cell.mine{background:var(--accent-soft);border-color:var(--accent)}
.cell.sel{box-shadow:0 0 0 2px var(--accent)}

.dn.sun{color:var(--sun)} .dn.sat{color:var(--sat)}
.cell.today .dn{background:var(--accent);color:var(--on-accent)}
.hol{font-size:9px;color:var(--sun);line-height:1.2;padding-left:2px;word-break:break-all}

.band.op .who-n{display:none}
.who-n{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.vdots{display:flex;flex-direction:column;gap:2px;flex-shrink:0;width:7px;align-items:center}
.band.op .vdots{flex-direction:row;width:auto;gap:2px}
.vdots .sd{width:7px;height:7px}
.cell.closed .bands{display:none}
.lg-rows{color:var(--ink-faint)}
.lg-rows b{color:var(--ink-soft);font-weight:700}
.foot{font-size:12px;color:var(--ink-faint);text-align:center;line-height:1.6}

.day.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.day.past{opacity:.5}

.rows{display:flex;flex-direction:column;gap:5px;min-width:0}

.row .dots .sd{width:10px;height:10px;border-radius:10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--ink-faint)}

<script id="pcode">
"use strict";
const WD=["日","月","火","水","木","金","土"];
const CLINIC=[1,2,4,5,6];

const HOLIDAYS={"2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日","2026-02-23":"天皇誕生日","2026-03-20":"春分の日","2026-04-29":"昭和の日","2026-05-03":"憲法記念日","2026-05-04":"みどりの日","2026-05-05":"こどもの日","2026-05-06":"振替休日","2026-07-20":"海の日","2026-08-11":"山の日","2026-09-21":"敬老の日","2026-09-22":"国民の休日","2026-09-23":"秋分の日","2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日","2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日","2027-02-23":"天皇誕生日"};

const toKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DATA=(()=>{ try{ return JSON.parse(document.getElementById("pdata").textContent); }catch(e){ return {doctors:[],shifts:[]}; } })();

// 応援医（名前を出さない勤務）は灰色の「応援医」で表示
docById._support={id:"_support",name:"応援医",color:"#8E9690"};
(DATA.shifts||[]).forEach(([d,s,id])=>{ if(docById[id]) (byDate[d]=byDate[d]||[]).push({s,id}); });
const absMap={};
(DATA.absences||[]).forEach(([d,w,p])=>{ if(!["director","vice","viceExtra"].includes(w)) return; const a=absMap[d]=absMap[d]||{director:[],vice:[],viceExtra:[]}; if(!a[w].includes(p)) a[w].push(p); });
const ls=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k)||""; localStorage.setItem(k,v); }catch(e){ return ""; } };
const now=new Date();
const savedOnly=ls("pub_only");
const st={y:now.getFullYear(),m:now.getMonth(),only:savedOnly,view:ls("pub_view")||"cal",sheet:null,settings:false,secretName:"",codeMsg:"",busy:false};
if(st.only&&!docById[st.only]) st.only="";

const CLOSED={}; (DATA.closed||[]).forEach(([d,n])=>{ CLOSED[d]=String(n||"休診"); });
const offName=k=>HOLIDAYS[k]||CLOSED[k]||"";
const isOpen=d=>CLINIC.includes(d.getDay())&&!offName(toKey(d));

const fam=n=>String(n).split(/[\s　(（]/)[0];
const famCount={}; (DATA.doctors||[]).forEach(d=>{ const f=fam(d.name); famCount[f]=(famCount[f]||0)+1; });

function slotTime(d,s){ if(s==="AM") return "9:00〜12:00"; if(s==="OP") return "13:30〜16:00"; if(s==="TUE_EVE") return "17:30〜19:00"; return d.getDay()===6?"16:00〜18:00":"16:00〜19:00"; }
function presence(d,k,part){ if(!isOpen(d)) return []; const a=absMap[k]||{director:[],vice:[],viceExtra:[]};
  return ["director","vice"].filter(w=>(STAFF[w].parts(d).includes(part)&&!a[w].includes(part))||(w==="vice"&&a.viceExtra.includes(part))); }
function rowsFor(d,k){
  const list=byDate[k]||[];
  const r=[{key:"AM",ab:"午",label:"午前",ids:list.filter(x=>x.s==="AM").map(x=>x.h?x.id+"#h":x.id)},
           {key:"OP",ab:"処",label:"処置・手術",ids:null},
           {key:"PM",ab:"夕",label:"夕診",ids:list.filter(x=>x.s==="PM").map(x=>x.h?x.id+"#h":x.id)}];
  const ev=list.filter(x=>x.s==="TUE_EVE").map(x=>x.h?x.id+"#h":x.id);
  if(ev.length) r.push({key:"TUE_EVE",ab:"夜",label:"夜診",ids:ev});
  r.forEach(x=>x.who=presence(d,k,x.key==="TUE_EVE"?"PM":x.key));
  return r;
}
const HIDDEN=new Set();
const nm=(raw,cls,sfx)=>{ const [id,fl]=String(raw).split("#"); const doc=docById[id]; const hid=fl==="h"||HIDDEN.has(id); return `<span class="nm${cls||""}${hid?" hid":""}${id==="_support"?" sup":""}${st.only&&st.only!==id?" dim":""}" style="background:${esc(doc.color||"#2F6F62")};--c:${esc(doc.color||"#2F6F62")}">${esc(short(doc.name))}${sfx&&id!=="_support"?"先生":""}</span>`; };
const dots=who=>who.map(w=>`<span class="sd ${w}"></span>`).join("");

function myShifts(){ return st.only?Object.keys(byDate).sort().flatMap(k=>byDate[k].filter(x=>x.id===st.only).map(x=>({k,s:x.s}))):[]; }
function mineCard(){
  if(!st.only) return "";
  const tk=toKey(new Date()), all=myShifts(), mk=`${st.y}-${pad(st.m+1)}`;
  const nx=all.find(x=>x.k>=tk), cnt=all.filter(x=>x.k.startsWith(mk)).length;
  const lab={AM:"午前",PM:"夕診",TUE_EVE:"夜診"};
  const nxt=nx?(()=>{ const d=fromKey(nx.k); return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）${lab[nx.s]} ${slotTime(d,nx.s)}`; })():"予定はまだありません";
  return `<div class="mine-card"><span class="lbl">${esc(short(docById[st.only].name))}先生の次の勤務</span><span class="next">${nxt}</span><span class="sub">${st.m+1}月の勤務 ${cnt}回</span></div>`;
}
function renderCal(){
  const first=new Date(st.y,st.m,1), off=first.getDay(), days=new Date(st.y,st.m+1,0).getDate(), tk=toKey(new Date());
  let h=WD.map((w,i)=>`<div class="wd ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("");
  for(let i=0;i<off;i++) h+=`<div class="cell blank"></div>`;
  for(let n=1;n<=days;n++){
    const d=new Date(st.y,st.m,n), k=toKey(d), open=isOpen(d), hol=CLINIC.includes(d.getDay())||HOLIDAYS[k]?offName(k):"", list=byDate[k]||[];
    const mine=st.only&&list.some(x=>x.id===st.only);
    const dc=d.getDay()===0||hol?"sun":d.getDay()===6?"sat":"";
    let inner="";
    if(open){ const rs=rowsFor(d,k); const band=(r,cls)=>`<div class="band ${cls}"><div class="who-n">${r?(r.ids||[]).map(id=>nm(id)).join(""):""}</div><div class="vdots">${r?dots(r.who):""}</div></div>`;
      const pm=rs.find(r=>r.key==="PM"), ev=rs.find(r=>r.key==="TUE_EVE");
      if(ev) pm.ids=pm.ids.concat(ev.ids);
      inner=`<div class="bands">${band(rs[0],"am")}${band(rs[1],"op")}${band(pm,"pm")}</div>`; }
    else if(hol) inner=`<div class="hol">${esc(hol)}</div>`;
    h+=`<button class="cell${open?"":" closed"}${k===tk?" today":""}${k<tk?" past":""}${mine?" mine":""}${st.sheet===k?" sel":""}" data-a="day" data-k="${k}" aria-label="${st.m+1}月${n}日"><span class="dn ${dc}">${n}</span>${inner}</button>`;
  }
  return `<div class="legend"><span><span class="sd director"></span>院長</span><span><span class="sd vice"></span>副院長</span><span class="lg-rows">マスの中は上から<b>午前</b>・<b>処置</b>・<b>夕診</b></span></div><div class="grid" id="grid">${h}</div>`;
}
// 院長・副院長用：非常勤が入っていない枠（月火木金の夕診・土曜の午前と夕診）。今日以降のみ
function shortages(){
  const last=new Date(st.y,st.m+1,0).getDate(), tk=toKey(new Date()), out=[];
  for(let n=1;n<=last;n++){
    const d=new Date(st.y,st.m,n), k=toKey(d), w=d.getDay(); if(k<tk||!isOpen(d)) continue;
    const need=w===6?["AM","PM"]:[1,2,4,5].includes(w)?["PM"]:[]; const list=byDate[k]||[];
    const miss=need.filter(s=>!list.some(x=>x.s===s)); if(miss.length) out.push({d,k,miss});
  }
  return out;
}
function shortText(){
  const L=shortages().map(x=>`${x.d.getMonth()+1}/${x.d.getDate()}（${WD[x.d.getDay()]}）${x.miss.map(s=>s==="AM"?"午前":"夕診").join("・")}`);
  return `${st.m+1}月 非常勤の先生が未定の枠\n`+(L.length?L.join("\n"):"なし");
}
function shortCard(){
  if(st.role!=="staff"||st.preview||st.only) return "";
  const s=shortages();
  return `<div class="short-card"><div class="hd"><div><div class="tt">${st.m+1}月の不足（非常勤なし）</div><div class="sub">月火木金の夕診・土曜の午前と夕診／今日以降</div></div>${s.length?`<button class="today-btn" data-a="copyshort" style="height:34px;flex:none">${st.copied?"コピーしました":"コピー"}</button>`:""}</div>${s.length?`<ul>${s.map(x=>`<li><b>${x.d.getMonth()+1}/${x.d.getDate()}（${WD[x.d.getDay()]}）</b>${x.miss.map(m=>m==="AM"?"午前":"夕診").join("・")}</li>`).join("")}</ul>`:`<div class="ok">不足はありません</div>`}</div>`;
}
function renderList(){
  const last=new Date(st.y,st.m+1,0).getDate(), tk=toKey(new Date()); let h="";
  for(let n=1;n<=last;n++){
    const d=new Date(st.y,st.m,n), k=toKey(d); if(!isOpen(d)) continue;
    const list=byDate[k]||[]; if(st.only&&!list.some(x=>x.id===st.only)) continue;
    h+=`<button class="day${k===tk?" today":""}${k<tk?" past":""}" data-a="day" data-k="${k}"><div><div class="n">${n}</div><div class="w ${d.getDay()===6?"sat":""}">${WD[d.getDay()]}曜</div></div><div class="rows">${rowsFor(d,k).map(r=>`<div class="row"><span class="k">${r.label.replace("処置・手術","処置")}</span>${r.ids?(r.ids.length?r.ids.map(id=>nm(id,"",1)).join(""):`<span class="none">—</span>`):""}<span class="dots">${dots(r.who)}</span></div>`).join("")}</div></button>`;
  }
  return shortCard()+(h||`<div class="empty">${st.only?"この月の勤務はありません":"この月の勤務はまだ登録されていません"}</div>`);
}
/* 合言葉：応援医の先生が自分の勤務を見るための鍵。暗号化された勤務をこの端末でだけ開く */
const tenc=new TextEncoder(), tdec=new TextDecoder();
const unb64=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
async function openSecret(code){
  code=String(code||"").replace(/[\s-]/g,"").toUpperCase();
  if(!code||!(window.crypto&&crypto.subtle)) return null;
  for(const b of (DATA.secret||[])){
    try{
      const base=await crypto.subtle.importKey("raw",tenc.encode(code),"PBKDF2",false,["deriveKey"]);
      const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(b.s),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
      const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(b.i)},key,unb64(b.c));
      return {code,data:JSON.parse(tdec.decode(pt))};
    }catch(e){}
  }
  return null;
}
function applySecret(p){
  const P=p.data; if(st.role) return;
  if((P.kind||"doctor")==="staff") PUB_BY=JSON.parse(JSON.stringify(byDate));
  st.role=P.kind||"doctor"; st.roleLabel=P.label||""; st.editUrl=/^https:\/\/claude\.ai\//.test(P.edit||"")?P.edit:"";
  (P.doctors||[]).forEach(doc=>{ if(docById[doc.id]) return; docById[doc.id]=doc; DATA.doctors=(DATA.doctors||[]).concat([doc]); if(st.role==="staff") HIDDEN.add(doc.id); const f=fam(doc.name); famCount[f]=(famCount[f]||0)+1; });
  (P.shifts||[]).forEach(([d,s,id])=>{ const L=(byDate[d]=byDate[d]||[]); const i=L.findIndex(x=>x.id==="_support"&&x.s===s); if(i>=0) L.splice(i,1); L.push({s,id,h:st.role==="staff"&&!HIDDEN.has(id)}); });
  if(st.role==="doctor"&&P.doctors&&P.doctors[0]){ const me=P.doctors[0].id; st.secretName=short(P.doctors[0].name); if(!savedOnly||savedOnly===me) st.only=me; }
  else if(savedOnly&&docById[savedOnly]) st.only=savedOnly;
  if(st.role==="staff") STAFF_BY=byDate;
}
function roleBanner(){
  if(st.preview) return "";
  if(st.role==="staff") return `<div class="role-bn staff">${esc(st.roleLabel||"院長")}用の表示：応援医・非公開の勤務も含めた全員分です。<span class="nm hid" style="--c:var(--ink-soft);padding:0 5px">点線</span>の名前は、ほかの非常勤の先生には見えていません。${st.editUrl?`<div style="margin-top:10px"><a class="today-btn" href="${esc(st.editUrl)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none">入力・修正／今すぐ反映（院長アプリ）</a></div>`:""}</div>`;
  if(st.role==="doctor") return `<div class="role-bn">${esc(st.secretName)}先生の勤務は、ほかの非常勤の先生には表示されていません（応援医の設定）。このスマホにだけ表示しています。</div>`;
  return "";
}
function renderSettings(){
  if(!st.settings) return "";
  return `<div class="scrim" data-a="sclose"></div><div class="sheet" role="dialog" aria-label="設定"><div class="grab"></div>
    <div class="sh-head"><b>設定</b></div>
    <div class="blk"><div class="t"><b>アクセスコード</b></div>
    ${st.role?`<div>${st.role==="staff"?esc(st.roleLabel||"院長")+"用の表示（全員分）":esc(st.secretName)+"先生の勤務"}を、このスマホで表示しています。</div><div><button class="today-btn" data-a="forget">アクセスコードを消す</button></div>`
      :`<div class="sub" style="font-size:13.5px;color:var(--ink-soft)">院長からアクセスコードを受け取った方だけ入力してください。</div>
      <input id="codeIn" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="例：ABCD2345" style="font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);letter-spacing:.12em">
      ${st.codeMsg?`<div style="color:var(--sun);font-size:13.5px;font-weight:700">${esc(st.codeMsg)}</div>`:""}
      <div><button class="today-btn" data-a="code" ${st.busy?"disabled":""}>${st.busy?"確認中…":"登録する"}</button></div>`}
    </div><button class="closebar" data-a="sclose">閉じる</button></div>`;
}
function renderSheet(){
  const k=st.sheet; if(!k) return "";
  const d=fromKey(k), title=`${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;
  let body;
  if(!isOpen(d)) body=`<div class="blk"><span class="none">${offName(k)&&offName(k)!=="休診"?esc(offName(k))+"のため":""}休診日です</span></div>`;
  else body=rowsFor(d,k).map(r=>`<div class="blk"><div class="t"><b>${r.label}</b><span>${slotTime(d,r.key)}</span></div>
    ${r.ids?`<div class="ppl">${r.ids.length?r.ids.map(id=>nm(id,"",1)).join(""):`<span class="none">非常勤の先生はいません</span>`}</div>`:""}
    <div class="ppl">${r.who.map(w=>`<span class="tag ${w}"><span class="sd ${w}"></span>${STAFF[w].label}</span>`).join("")||`<span class="none">院長・副院長はいません</span>`}</div></div>`).join("");
  return `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-label="${title}"><div class="grab"></div>
    <div class="sh-head"><b>${title}</b><div class="sh-nav"><button data-a="sprev" aria-label="前の日">‹</button><button data-a="snext" aria-label="次の日">›</button></div></div>
    ${body}<button class="closebar" data-a="close">閉じる</button></div>`;
}
function render(){
  const mk=`${st.y}-${pad(st.m+1)}`;
  const inMonth=new Set(Object.keys(byDate).filter(k=>k.startsWith(mk)).flatMap(k=>byDate[k].map(x=>x.id)));
  const chips=(DATA.doctors||[]).filter(d=>inMonth.has(d.id)||d.id===st.only);
  const up=DATA.updatedAt?new Date(DATA.updatedAt):null;
  const isThis=st.y===now.getFullYear()&&st.m===now.getMonth();
  document.getElementById("root").innerHTML=`<header><div class="wrap">
    <div class="r1"><div><h1>非常勤 勤務表<span class="keisho">敬称略</span></h1>${up?`<div class="upd">更新 ${up.getMonth()+1}/${up.getDate()} ${pad(up.getHours())}:${pad(up.getMinutes())}</div>`:""}</div>
      <div style="display:flex;gap:6px;align-items:center"><div class="seg"><button data-a="view" data-v="cal" aria-pressed="${st.view==="cal"}">カレンダー</button><button data-a="view" data-v="list" aria-pressed="${st.view==="list"}">リスト</button></div><button class="mbtn" data-a="settings" aria-label="設定" style="width:40px;height:34px;font-size:17px">⋯</button></div></div>
    <div class="r2"><button class="mbtn" data-a="prev" aria-label="前の月">‹</button><div class="mtitle">${st.y}年${st.m+1}月</div><button class="mbtn" data-a="next" aria-label="次の月">›</button><button class="today-btn" data-a="today"${isThis?' style="visibility:hidden" tabindex="-1" aria-hidden="true"':""}>今月</button></div>
    ${st.role==="staff"&&PUB_BY?`<div class="staffbar"><div class="seg"><button data-a="preview" data-v="0" aria-pressed="${!st.preview}">${esc(st.roleLabel||"院長")}の表示</button><button data-a="preview" data-v="1" aria-pressed="${!!st.preview}">非常勤からの見え方</button></div>${st.editUrl&&!st.preview?`<a class="today-btn" href="${esc(st.editUrl)}" target="_blank" rel="noopener">時給・入力</a>`:""}</div>`:""}
    <div class="chips"><button class="who" data-a="only" data-id="" aria-pressed="${!st.only}">全員</button>${chips.map(d=>`<button class="who" data-a="only" data-id="${esc(d.id)}" aria-pressed="${st.only===d.id}"><span class="dot" style="background:${esc(d.color)}"></span>${esc(short(d.name))}先生</button>`).join("")}</div>
  </div></header>
  <main class="wrap">${mineCard()}${st.view==="cal"?renderCal():renderList()}
    ${roleBanner()}<div class="foot">休診：水・日・祝　日付をタップすると詳しく見られます<br>勤務の変更・交代の相談は院長まで</div></main>${renderSheet()}${renderSettings()}`;
}
function move(dm){ st.m+=dm; if(st.m<0){st.m=11;st.y--;} if(st.m>11){st.m=0;st.y++;} render(); }
function moveDay(dd){ const d=fromKey(st.sheet); d.setDate(d.getDate()+dd); st.sheet=toKey(d); if(d.getMonth()!==st.m||d.getFullYear()!==st.y){ st.y=d.getFullYear(); st.m=d.getMonth(); } render(); }
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return; const a=el.dataset.a;
  if(a==="prev") move(-1); else if(a==="next") move(1);
  else if(a==="today"){ st.y=now.getFullYear(); st.m=now.getMonth(); render(); }
  else if(a==="only"){ st.only=el.dataset.id; ls("pub_only",st.only); render(); }
  else if(a==="view"){ st.view=el.dataset.v; ls("pub_view",st.view); render(); }
  else if(a==="day"){ st.sheet=el.dataset.k; render(); }
  else if(a==="close"){ st.sheet=null; render(); }
  else if(a==="sprev") moveDay(-1); else if(a==="snext") moveDay(1);
  else if(a==="settings"){ st.settings=true; st.codeMsg=""; render(); }
  else if(a==="sclose"){ st.settings=false; render(); }
  else if(a==="copyshort"){ const t=shortText(); const done=()=>{ st.copied=true; render(); setTimeout(()=>{ st.copied=false; render(); },2000); };
    const fb=()=>{ const ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length); try{ document.execCommand("copy"); }catch(e){} ta.remove(); done(); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,fb); else fb(); }
  else if(a==="preview"){ const v=el.dataset.v==="1"; if(v!==!!st.preview&&PUB_BY&&STAFF_BY){ st.preview=v; byDate=v?PUB_BY:STAFF_BY; st.only=""; st.sheet=null; render(); } }
  else if(a==="forget"){ ls("pub_code",""); location.reload(); }
  else if(a==="code"){ const v=(document.getElementById("codeIn")||{}).value||""; st.busy=true; render();
    openSecret(v).then(p=>{ st.busy=false; if(p){ ls("pub_code",p.code); applySecret(p); st.settings=false; } else st.codeMsg="アクセスコードが違います。もう一度確かめてください。"; render(); }); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&st.sheet){ st.sheet=null; render(); } });
// 左右スワイプで月を切り替え（シートが開いていないとき）
let sx=null,sy=null;
document.addEventListener("touchstart",e=>{ if(st.sheet||!e.target.closest("#grid,.day,main")) return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
document.addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) move(dx<0?1:-1); },{passive:true});
render();
{ const sc=ls("pub_code"); if(sc) openSecret(sc).then(p=>{ if(p){ applySecret(p); render(); } }); }
// 新しい版があれば読み込み直す（iPhoneが古いページを覚えている対策）
(()=>{ const mine=(DATA.updatedAt||"")+"|"+((document.querySelector('meta[name="build"]')||{}).content||"");
  let busy=false;
  const check=()=>{ if(busy||!navigator.onLine) return; busy=true;
    fetch(location.pathname+"?nc="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
      if(!t) return; const u=(t.match(/"updatedAt":\s*"([^"]*)"/)||[])[1]||""; const bd=(t.match(/<meta name="build" content="([^"]*)"/)||[])[1]||"";
      const theirs=u+"|"+bd; if(theirs===mine){ try{ sessionStorage.removeItem("reloads"); }catch(e){} return; }
      let n=0; try{ n=+sessionStorage.getItem("reloads")||0; }catch(e){} if(n>=2) return;
      try{ sessionStorage.setItem("reloads",String(n+1)); }catch(e){}
      location.replace(location.pathname+"?r="+Date.now());
    }).catch(()=>{}).finally(()=>{ busy=false; }); };
  check(); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") check(); });
})();
</script>
